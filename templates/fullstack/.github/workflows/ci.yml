name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: b7 }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres -d b7" --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run db:migrate
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      # The local Workers runtime reads secrets from .dev.vars, not from the process environment.
      - run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" > .dev.vars
      - run: pnpm run test:e2e

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Expand-then-contract migrations: old and new Worker versions overlap briefly during deploy.
      - run: pnpm run db:migrate
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Mandatory: the Vitest Workers pool injects nodejs_compat, so only a deployed check proves the Worker runs.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test smoke
        env: { BASE_URL: "${{ vars.PRODUCTION_URL }}" }
