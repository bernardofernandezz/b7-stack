name: create-b7
on:
  pull_request:
  push:
    branches: [main]

# Tests create-b7, packs it the way npm publishes it (cli/README.md › Release), generates a project and runs that
# project's checks and Docker stack.
jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: cli/go.mod, cache-dependency-path: cli/go.sum }
      - working-directory: cli
        run: |
          go generate ./...
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
      - uses: actions/setup-node@v4
        with: { node-version: 26 }
      # The landing's JS copy of the rules runs the same fixtures as the Go tests (cli/testdata).
      - run: node --test
        working-directory: site

  # The release ships macOS and Windows binaries, so the Go tests (which build and run the binary) run there too.
  cli-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Keeps LF endings: the template is embedded as checked out, and CRLF would leave region markers behind.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: cli/go.mod, cache-dependency-path: cli/go.sum }
      - working-directory: cli
        run: |
          go generate ./...
          go test ./...

  generated-project:
    name: generated-project (${{ matrix.config.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Representative configurations (site/content/docs/configuration-model.md), plus each option on its own.
        config:
          - { name: minimal, args: "--email none" }
          - { name: email, args: "--email resend" }
          - { name: organizations, args: "--organizations" }
          - { name: billing, args: "--billing stripe" }
          - { name: b2b-saas, args: "--organizations --email resend --billing stripe" }
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: b7 }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres -d b7" --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.16.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 26 }
      - uses: actions/setup-go@v5
        with: { go-version-file: cli/go.mod, cache-dependency-path: cli/go.sum }
      - uses: goreleaser/goreleaser-action@v6
        with: { version: "~> v2", args: build --snapshot --single-target --clean, workdir: cli }
      - working-directory: cli
        run: |
          node scripts/npm-packages.js
          (cd npm-dist/create-b7 && npm pack)
          (cd npm-dist/create-b7-linux-x64 && npm pack)
      # The wrapper finds the binary in create-b7-linux-x64, installed next to it as npm installs an optional dependency.
      # The globs are expanded on their own: inside "--package=..." bash would not match them.
      - run: |
          WRAPPER=$(ls "$GITHUB_WORKSPACE"/cli/npm-dist/create-b7/create-b7-*.tgz)
          BINARY=$(ls "$GITHUB_WORKSPACE"/cli/npm-dist/create-b7-linux-x64/create-b7-linux-x64-*.tgz)
          npm exec --yes --package="$WRAPPER" --package="$BINARY" -- create-b7 demo-app --yes --no-git ${{ matrix.config.args }}
        working-directory: ${{ runner.temp }}
      - name: Check generated project
        working-directory: ${{ runner.temp }}/demo-app
        # The generated .env has a random password; the CI database uses its own. Variables win over .env.
        env: { DATABASE_URL: "postgres://postgres:postgres@localhost:5432/b7" }
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm run db:migrate
          pnpm run test
          pnpm run build
          pnpm exec playwright install --with-deps chromium
          pnpm run test:e2e

  generated-stack:
    name: generated-stack (${{ matrix.config.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Representative configurations (site/content/docs/configuration-model.md), plus each option on its own.
        config:
          - { name: minimal, args: "--email none" }
          - { name: email, args: "--email resend" }
          - { name: organizations, args: "--organizations" }
          - { name: billing, args: "--billing stripe" }
          - { name: b2b-saas, args: "--organizations --email resend --billing stripe" }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.16.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 26 }
      - uses: actions/setup-go@v5
        with: { go-version-file: cli/go.mod, cache-dependency-path: cli/go.sum }
      - uses: goreleaser/goreleaser-action@v6
        with: { version: "~> v2", args: build --snapshot --single-target --clean, workdir: cli }
      - working-directory: cli
        run: |
          node scripts/npm-packages.js
          (cd npm-dist/create-b7 && npm pack)
          (cd npm-dist/create-b7-linux-x64 && npm pack)
      # The wrapper finds the binary in create-b7-linux-x64, installed next to it as npm installs an optional dependency.
      # The globs are expanded on their own: inside "--package=..." bash would not match them.
      - run: |
          WRAPPER=$(ls "$GITHUB_WORKSPACE"/cli/npm-dist/create-b7/create-b7-*.tgz)
          BINARY=$(ls "$GITHUB_WORKSPACE"/cli/npm-dist/create-b7-linux-x64/create-b7-linux-x64-*.tgz)
          npm exec --yes --package="$WRAPPER" --package="$BINARY" -- create-b7 demo-app --yes --no-git ${{ matrix.config.args }}
        working-directory: ${{ runner.temp }}
      - name: Run the Compose stack and E2E through Caddy
        working-directory: ${{ runner.temp }}/demo-app
        run: |
          docker compose up -d --build --wait
          pnpm exec playwright install --with-deps chromium
          # Auth rate limits are real through Caddy, so only the production-stack flows run here (see the template CI).
          BASE_URL=http://localhost pnpm exec playwright test smoke notes navigation billing
      - if: failure()
        working-directory: ${{ runner.temp }}/demo-app
        run: docker compose logs
